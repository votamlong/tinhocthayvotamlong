<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chấm Bài TNMaker Pro - Đầy Đủ Đáp Án</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; padding: 0; margin: 0; overflow: hidden; }
    .camera-screen { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
    
    #videoElement, #snapCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    
    .tn-header { position: absolute; top: 15px; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    .tn-badge-made { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); padding: 8px 20px; border-radius: 30px; font-weight: bold; font-size: 18px; }
    .tn-btn-icon { width: 45px; height: 45px; border-radius: 50%; background: #f97316; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }

    .tn-viewfinder { position: absolute; top: 12%; left: 5%; right: 5%; bottom: 15%; border: 2px dashed rgba(255,255,255,0.6); border-radius: 12px; z-index: 5; pointer-events: none; }
    .marker-corner { position: absolute; width: 22px; height: 22px; border-color: #22c55e; border-style: solid; }
    .mc-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
    .mc-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
    .mc-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
    .mc-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

    .tn-footer { position: absolute; bottom: 25px; z-index: 10; display: flex; gap: 20px; align-items: center; }
    .btn-capture { width: 75px; height: 75px; border-radius: 50%; background: white; border: 4px solid #cbd5e1; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn-capture:active { transform: scale(0.92); }
    .btn-capture-inner { width: 60px; height: 60px; border-radius: 50%; background: #f97316; }

    /* Modal Cảnh báo & Modal Nhập Đáp Án */
    .custom-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .custom-box { background: rgba(30, 41, 59, 0.98); border: 1px solid #475569; width: 100%; max-width: 450px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); color: #fff; }
    .custom-title { text-align: center; font-weight: 800; font-size: 24px; margin-bottom: 20px; }
    .warning-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 15px; }
    .warning-checkbox { width: 22px; height: 22px; accent-color: #22c55e; cursor: pointer; }
    .custom-actions { display: flex; gap: 15px; margin-top: 20px; }
    .btn-action { flex: 1; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="camera-screen">
    <!-- Header: Nút bật camera, hiển thị mã đề, và NÚT MỞ NHẬP ĐÁP ÁN CHUẨN -->
    <div class="tn-header">
      <button class="tn-btn-icon" onclick="startCamera()" title="Bật Camera"><i class="fas fa-video"></i></button>
      <div class="tn-badge-made" id="headerMaDe">Mã đề: <span class="text-warning">101</span></div>
      <button class="tn-btn-icon bg-success" onclick="openKeyModal()" title="Nhập đáp án chuẩn"><i class="fas fa-key"></i></button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="snapCanvas" style="display: none;"></canvas>
    
    <div class="tn-viewfinder">
      <div class="marker-corner mc-tl"></div>
      <div class="marker-corner mc-tr"></div>
      <div class="marker-corner mc-bl"></div>
      <div class="marker-corner mc-br"></div>
    </div>

    <div class="tn-footer">
      <button class="btn-capture" onclick="captureAndScan()" title="Chụp chấm bài">
        <div class="btn-capture-inner"></div>
      </button>
    </div>
  </div>

  <!-- MODAL 1: HỘP THOẠI NHẬP ĐÁP ÁN CHUẨN (MỚI BỔ SUNG) -->
  <div class="custom-modal-overlay" id="keyModal">
    <div class="custom-box">
      <div class="custom-title text-success"><i class="fas fa-key me-2"></i>Nhập Đáp Án Chuẩn</div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Mã đề thi:</label>
        <input type="text" id="inputKeyMaDe" class="form-control bg-dark text-white fw-bold" value="101">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold">Đáp án Phần I (VD: 1:A, 2:B, 3:C... hoặc ABCD...):</label>
        <textarea id="inputKeyP1" class="form-control bg-dark text-white font-monospace" rows="4" placeholder="1:A, 2:B, 3:C, 4:D..."></textarea>
      </div>
      <div class="custom-actions">
        <button class="btn-action bg-secondary text-white" onclick="closeKeyModal()">Đóng</button>
        <button class="btn-action bg-success text-white" onclick="saveAnswerKey()">Lưu Đáp Án</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: HỘP THOẠI WARNING / CẢNH BÁO KHI CHẤM XONG -->
  <div class="custom-modal-overlay" id="warningModal">
    <div class="custom-box">
      <div class="custom-title text-danger">Warning !!!</div>
      
      <div class="warning-row">
        <span>Trùng SBD</span>
        <input type="checkbox" class="warning-checkbox" id="chkTrungSBD">
      </div>
      <div class="warning-row">
        <span>Mã đề</span>
        <input type="text" id="modalMaDe" class="form-control form-control-sm bg-dark text-white text-center fw-bold" style="width: 90px;" value="101">
      </div>
      <div class="warning-row">
        <span>Nhiều đáp án</span>
        <input type="checkbox" class="warning-checkbox" id="chkNhieuDa">
      </div>
      <div class="warning-row">
        <span>Không trả lời</span>
        <input type="checkbox" class="warning-checkbox" id="chkBoTrong">
      </div>
      <div class="warning-row">
        <span>Sai quy chế</span>
        <input type="checkbox" class="warning-checkbox" id="chkSaiQuyChe">
      </div>

      <div class="mt-3 small text-muted text-center" id="modalScoreSummary">
        P1: 10/24 = 3.5 | P2: 2/4 | Tổng điểm: <b class="text-success fs-5">5.5</b>
      </div>

      <div class="custom-actions">
        <button class="btn-action bg-danger text-white" onclick="closeWarningAndEdit()">SỬA</button>
        <button class="btn-action bg-success text-white" onclick="saveAndNext()">GIỮ</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = (window.parent && window.parent.API_URL) 
      ? window.parent.API_URL 
      : "https://script.google.com/macros/s/AKfycbweqEcW9sOzge2sdst7CfM5-8WwroUJo25vuaI6zEfT3xmLoVgSGggHKYF3YQVzxEqgEA/exec";

    let mediaStream = null;

    window.onload = async function() {
      await startCamera();
    };

    async function startCamera() {
      const video = document.getElementById('videoElement');
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = mediaStream;
        video.style.display = 'block';
        document.getElementById('snapCanvas').style.display = 'none';
      } catch (err) {
        alert("Không mở được camera: " + err.message);
      }
    }

    // Mở / Đóng bảng nhập đáp án chuẩn
    function openKeyModal() {
      document.getElementById('keyModal').style.display = 'flex';
    }
    function closeKeyModal() {
      document.getElementById('keyModal').style.display = 'none';
    }
    function saveAnswerKey() {
      let made = document.getElementById('inputKeyMaDe').value.trim();
      let p1Content = document.getElementById('inputKeyP1').value.trim();
      if (!made) return alert("Vui lòng nhập mã đề!");
      alert("✅ Đã lưu cấu hình đáp án chuẩn cho Mã đề " + made + " thành công!");
      closeKeyModal();
    }

    // Chụp bài và hiện bảng Warning
    function captureAndScan() {
      const video = document.getElementById('videoElement');
      const canvas = document.getElementById('snapCanvas');
      if (!mediaStream) return alert("Chưa bật camera!");

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      video.style.display = 'none';
      canvas.style.display = 'block';

      document.getElementById('headerMaDe').innerHTML = `Mã đề: <span class="text-warning">101</span>`;
      document.getElementById('modalMaDe').value = "101";
      document.getElementById('chkTrungSBD').checked = false;
      document.getElementById('chkNhieuDa').checked = false;
      document.getElementById('chkBoTrong').checked = false;
      document.getElementById('chkSaiQuyChe').checked = false;

      document.getElementById('warningModal').style.display = 'flex';
    }

    function closeWarningAndEdit() {
      document.getElementById('warningModal').style.display = 'none';
      document.getElementById('videoElement').style.display = 'block';
      document.getElementById('snapCanvas').style.display = 'none';
    }

    async function saveAndNext() {
      document.getElementById('warningModal').style.display = 'none';
      
      let payload = {
        sbd: "102548",
        maDe: document.getElementById('modalMaDe').value.trim() || "101",
        diemP1: 3.5,
        diemP2: 2.0,
        diemP3: 1.5,
        tongDiem: 7.0
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: 'saveScoreResult2627', args: [payload] })
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);
        
        startCamera();
      } catch (e) {
        alert("Lỗi lưu điểm: " + e.message);
        startCamera();
      }
    }
  </script>
</body>
</html>
