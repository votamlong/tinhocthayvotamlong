<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống Kê Chuyên Cần</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    .grid-table-scroll { max-height: 65vh; overflow-y: auto; overflow-x: auto; border: 1px solid #dee2e6; border-radius: 12px; background: white; }
    .sticky-header th { position: sticky; top: 0; background: #f8fafc !important; z-index: 10; border-bottom: 2px solid #cbd5e0; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card border-0 shadow-sm rounded-4 p-4 bg-white d-flex flex-column" style="height: 90vh;">
    <h4 class="fw-bold text-primary mb-3"><i class="fas fa-calendar-alt me-2"></i>Thống Kê Chuyên Cần Học Sinh</h4>
    
    <!-- THANH CÔNG CỤ LỌC -->
    <div class="row g-3 align-items-center mb-4 bg-light p-3 rounded-3">
      <div class="col-md-3">
        <label class="form-label small fw-bold text-secondary">Chọn Lớp (Sheet GVCN):</label>
        <select id="att-class-select" class="form-select shadow-sm">
          <option value="TOAN_TRUONG">🌐 Toàn Trường</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-bold text-secondary">Từ Ngày:</label>
        <input type="date" id="att-start-date" class="form-control shadow-sm">
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-bold text-secondary">Đến Ngày:</label>
        <input type="date" id="att-end-date" class="form-control shadow-sm">
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button onclick="loadAttendanceReport()" class="btn btn-primary w-100 fw-bold shadow-sm">
          <i class="fas fa-search me-2"></i>Tra Cứu Thống Kê
        </button>
      </div>
    </div>

    <!-- BẢNG HIỂN THỊ KẾT QUẢ -->
    <div class="grid-table-scroll flex-grow-1">
      <table class="table table-hover align-middle mb-0">
        <thead class="sticky-header">
          <tr>
            <th>STT</th>
            <th>Ngày Điểm Danh</th>
            <th>Mã HS</th>
            <th>Họ và Tên Học Sinh</th>
            <th>Lớp</th>
            <th>Trạng Thái</th>
            <th>Ghi Chú / Tiết</th>
          </tr>
        </thead>
        <tbody id="attendance-table-body">
          <tr><td colspan="7" class="text-center text-muted py-4">Vui lòng chọn mốc thời gian và bấm "Tra Cứu Thống Kê".</td></tr>
        </tbody>
      </table>
    </div>
  </div>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwz6zCj4Lg76sa68KaB1dHJiGDhlzacFyFb4enYcXR1maOxioQhjUFQtnCo4FMl-I_vkg/exec";

    window.google = window.google || {};
    window.google.script = {
      run: new Proxy({}, {
        get: function(target, prop) {
          return function(...args) {
            return {
              withSuccessHandler: function(successCb) {
                fetch(API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ fn: prop, args: args })
                })
                .then(res => res.json())
                .then(json => {
                  if (json.error) alert('Lỗi: ' + json.error);
                  else if (successCb) successCb(json.result);
                })
                .catch(err => console.error(err));
                return this;
              },
              withFailureHandler: function(failCb) { return this; }
            };
          };
        }
      })
    };

    // 1. TỰ ĐỘNG LẤY DANH SÁCH LỚP TỪ HỆ THỐNG CHÍNH ĐƯA VÀO Ô CHỌN
    window.onload = function() {
      var today = new Date().toISOString().split('T')[0];
      document.getElementById('att-start-date').value = today;
      document.getElementById('att-end-date').value = today;

      // Gọi hàm lấy toàn bộ lớp chung của hệ thống
      google.script.run.withSuccessHandler(function(classes) {
        var select = document.getElementById('att-class-select');
        var html = '<option value="TOAN_TRUONG">🌐 Toàn Trường</option>';
        if (classes && classes.length > 0) {
          classes.forEach(function(cls) {
            html += `<option value="${cls}">${cls}</option>`;
          });
        }
        select.innerHTML = html;
        document.getElementById('attendance-table-body').innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Đã tải xong danh sách lớp. Vui lòng chọn mốc thời gian và bấm "Tra Cứu Thống Kê".</td></tr>`;
      }).getAllClasses();
    };

    // 2. HÀM TRA CỨU DỮ LIỆU CHUYÊN CẦN
    function loadAttendanceReport() {
      var classVal = document.getElementById('att-class-select').value;
      var startDate = document.getElementById('att-start-date').value;
      var endDate = document.getElementById('att-end-date').value;

      if (!startDate || !endDate) {
        alert("Vui lòng chọn đầy đủ 'Từ ngày' và 'Đến ngày'!");
        return;
      }

      var tbody = document.getElementById('attendance-table-body');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-primary py-4"><i class="fas fa-spinner fa-spin me-2"></i>Đang tải dữ liệu chuyên cần...</td></tr>`;

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.success) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Lỗi: ${res ? res.message : "Không nhận được phản hồi"}</td></tr>`;
            return;
          }

          var list = res.data;
          if (!list || list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Không có dữ liệu chuyên cần trong khoảng thời gian này.</td></tr>`;
            return;
          }

          var html = '';
          list.forEach(function(item, index) {
            var badgeColor = String(item.status).toUpperCase().includes('V') ? 'bg-danger' : 'bg-success';
            html += `<tr>
                       <td>${index + 1}</td>
                       <td class="fw-bold">${item.date}</td>
                       <td><span class="badge bg-light text-dark border">${item.studentId}</span></td>
                       <td class="fw-bold text-dark">${item.studentName}</td>
                       <td><span class="badge bg-secondary">${item.className}</span></td>
                       <td><span class="badge ${badgeColor}">${item.status}</span></td>
                       <td>${item.note || ''}</td>
                     </tr>`;
          });
          tbody.innerHTML = html;
        })
        .getAttendanceStats2627(classVal, startDate, endDate);
    }
  </script>
</body>
</html>
