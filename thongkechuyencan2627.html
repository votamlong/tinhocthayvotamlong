<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống Kê Chuyên Cần</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    .grid-table-scroll { max-height: 62vh; overflow-y: auto; overflow-x: auto; border: 1px solid #dee2e6; border-radius: 12px; background: white; }
    .sticky-header th { position: sticky; top: 0; background: #f8fafc !important; z-index: 10; border-bottom: 2px solid #cbd5e0; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="card border-0 shadow-sm rounded-4 p-4 bg-white d-flex flex-column" style="height: 90vh;">
    <h4 class="fw-bold text-primary mb-3"><i class="fas fa-calendar-alt me-2"></i>Thống Kê Chuyên Cần Học Sinh (Tổng Hợp 1 Dòng)</h4>
    
    <!-- THANH CÔNG CỤ LỌC -->
    <div class="row g-3 align-items-center mb-4 bg-light p-3 rounded-3">
      <div class="col-md-3">
        <label class="form-label small fw-bold text-secondary">Chọn Lớp:</label>
        <select id="att-class-select" class="form-select shadow-sm fw-bold border-primary">
          <option value="TOAN_TRUONG">🌐 Toàn Trường</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-bold text-secondary">Trạng Thái:</label>
        <select id="att-status-filter" class="form-select shadow-sm fw-bold">
          <option value="ALL">🔍 Tất Cả</option>
          <option value="VANG">❌ Chỉ Xem Vắng</option>
          <option value="CO_MAT">✅ Chỉ Xem Có Mặt</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-bold text-secondary">Từ Ngày:</label>
        <input type="date" id="att-start-date" class="form-control shadow-sm">
      </div>
      <div class="col-md-2">
        <label class="form-label small fw-bold text-secondary">Đến Ngày:</label>
        <input type="date" id="att-end-date" class="form-control shadow-sm">
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button onclick="loadAttendanceReport()" class="btn btn-primary w-100 fw-bold shadow-sm">
          <i class="fas fa-search me-2"></i>Tra Cứu Thống Kê
        </button>
      </div>
    </div>

    <!-- BẢNG HIỂN THỊ KẾT QUẢ -->
    <div class="grid-table-scroll flex-grow-1">
      <table class="table table-hover align-middle mb-0 text-center">
        <thead class="sticky-header">
          <tr>
            <th style="width: 50px;">STT</th>
            <th style="width: 100px;">Mã HS</th>
            <th class="text-start" style="width: 220px;">Họ và Tên Học Sinh</th>
            <th style="width: 90px;">Lớp</th>
            <th style="width: 80px;">Có Mặt</th>
            <th style="width: 80px;">Vắng</th>
            <th class="text-start">Chi Tiết Ngày Vắng / Ghi Chú</th>
          </tr>
        </thead>
        <tbody id="attendance-table-body">
          <tr><td colspan="7" class="text-center text-muted py-4">Vui lòng chọn mốc thời gian và bấm "Tra Cứu Thống Kê".</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = (window.parent && window.parent.API_URL) 
      ? window.parent.API_URL 
      : "https://script.google.com/macros/s/AKfycbwN1-AKsm8fV8DQ7ya5QdGGnaFRnXOBNAEHetCEE4r1CWad4AlY5DnXDZZcxndWNtnilw/exec";

    async function callApi(fn, ...args) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      return data.result;
    }

    let globalAttendanceData = [];

    window.onload = async function() {
      try {
        var today = new Date().toISOString().split('T')[0];
        document.getElementById('att-start-date').value = "2026-09-01"; // Mặc định từ đầu năm học cho dễ thấy dữ liệu
        document.getElementById('att-end-date').value = today;

        let students = await callApi('getAllStudents2627') || [];
        if (students.length === 0) {
          let stData = await callApi('getAllStudents');
          students = (stData || []).map(s => ({ id: s.id, name: s.name, className: s.className }));
        }

        let setC = new Set();
        students.forEach(s => { if (s.className) setC.add(s.className); });
        let classes = Array.from(setC).sort();

        let classOpts = '<option value="TOAN_TRUONG">🌐 Toàn Trường</option>';
        classes.forEach(c => classOpts += `<option value="${c}">${c}</option>`);
        document.getElementById('att-class-select').innerHTML = classOpts;
      } catch (err) {
        console.error("Lỗi tải danh sách lớp:", err);
      }
    };

    async function loadAttendanceReport() {
      var classVal = document.getElementById('att-class-select').value;
      var startDate = document.getElementById('att-start-date').value;
      var endDate = document.getElementById('att-end-date').value;

      if (!startDate || !endDate) {
        alert("Vui lòng chọn đầy đủ 'Từ ngày' và 'Đến ngày'!");
        return;
      }

      var tbody = document.getElementById('attendance-table-body');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-primary py-4"><i class="fas fa-spinner fa-spin me-2"></i>Đang tổng hợp dữ liệu chuyên cần...</td></tr>`;

      try {
        let res = await callApi('getAttendanceStats2627', classVal, startDate, endDate);
        if (!res || !res.success) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Lỗi: ${res ? res.message : "Không nhận được phản hồi"}</td></tr>`;
          return;
        }

        globalAttendanceData = res.data || [];
        renderTableFiltered();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Lỗi kết nối: ${err.message}</td></tr>`;
      }
    }

    function renderTableFiltered() {
      var statusFilter = document.getElementById('att-status-filter').value;
      var tbody = document.getElementById('attendance-table-body');

      let filteredList = globalAttendanceData.filter(item => {
        if (statusFilter === 'VANG') return item.countV > 0;
        if (statusFilter === 'CO_MAT') return item.countV === 0;
        return true;
      });

      if (filteredList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Không tìm thấy học sinh nào phù hợp với điều kiện lọc.</td></tr>`;
        return;
      }

      var html = '';
      filteredList.forEach(function(item, index) {
        var vắngBadge = item.countV > 0 ? `<span class="badge bg-danger px-2">${item.countV} lần</span>` : `<span class="text-muted">0</span>`;
        var cóMặtBadge = `<span class="badge bg-success px-2">${item.countC} buổi</span>`;
        
        html += `<tr>
                   <td class="text-muted fw-bold">${index + 1}</td>
                   <td><span class="badge bg-light text-dark border">${item.studentId}</span></td>
                   <td class="text-start fw-bold text-dark">${item.studentName}</td>
                   <td><span class="badge bg-secondary">${item.className}</span></td>
                   <td>${cóMặtBadge}</td>
                   <td>${vắngBadge}</td>
                   <td class="text-start small text-secondary">${item.note || '<span class="text-success fst-italic">Đi học đầy đủ, chuyên cần tốt</span>'}</td>
                 </tr>`;
      });
      tbody.innerHTML = html;
    }

    // Tự động lọc lại ngay khi đổi trạng thái select trên giao diện
    document.getElementById('att-status-filter').addEventListener('change', renderTableFiltered);
  </script>
</body>
</html>
