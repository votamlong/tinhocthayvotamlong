<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFO Gọi Tên Học Sinh 2627</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      user-select: none;
    }
    .space-stage {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 75%);
      border-radius: 24px;
      border: 1px solid #312e81;
      padding: 24px;
      position: relative;
      min-height: 560px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(99, 102, 241, 0.15);
    }
    .ufo-wrapper {
      position: relative;
      z-index: 10;
      animation: ufo-hover 3s ease-in-out infinite alternate;
    }
    @keyframes ufo-hover {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(12px) rotate(1deg); }
    }
    .ufo-disk {
      width: 230px;
      height: 75px;
      background: linear-gradient(180deg, #64748b 0%, #334155 60%, #0f172a 100%);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 4px 25px rgba(56, 189, 248, 0.5);
      border: 2px solid #94a3b8;
    }
    .ufo-dome {
      width: 105px;
      height: 58px;
      background: radial-gradient(circle at 50% 30%, #38bdf8 0%, #0284c7 70%, #0369a1 100%);
      border-radius: 50% 50% 0 0;
      margin: 0 auto -22px auto;
      border: 2px solid #7dd3fc;
      opacity: 0.95;
    }
    .ufo-lights {
      display: flex;
      justify-content: space-around;
      padding: 0 25px;
      position: absolute;
      width: 100%;
      bottom: 12px;
    }
    .ufo-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #facc15;
      animation: light-blink 0.6s infinite alternate;
    }
    .ufo-light:nth-child(2) { animation-delay: 0.2s; background: #38bdf8; }
    .ufo-light:nth-child(3) { animation-delay: 0.4s; background: #4ade80; }
    .ufo-light:nth-child(4) { animation-delay: 0.6s; background: #f43f5e; }
    @keyframes light-blink {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.3); box-shadow: 0 0 12px #fff; }
    }

    .tractor-beam {
      width: 330px;
      height: 330px;
      margin: -15px auto 0 auto;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.7) 0%, rgba(99, 102, 241, 0.15) 75%, transparent 100%);
      clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
      transition: all 0.3s ease;
      opacity: 0.25;
      filter: blur(1px);
    }
    .tractor-beam.active {
      opacity: 0.95;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.95) 0%, rgba(34, 197, 94, 0.6) 60%, rgba(99, 102, 241, 0.25) 100%);
      animation: beam-pulse 0.2s infinite alternate;
    }
    @keyframes beam-pulse {
      from { filter: drop-shadow(0 0 15px #38bdf8); }
      to { filter: drop-shadow(0 0 35px #22c55e); }
    }

    .student-display-box {
      margin-top: -190px;
      position: relative;
      z-index: 20;
      min-height: 130px;
    }
    .student-name-text {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(99, 102, 241, 0.6);
    }
    .student-id-text {
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 1.15rem;
    }
    .panel-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 16px;
      height: 100%;
    }
    .history-item {
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-left: 3px solid #38bdf8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container-fluid" style="max-width: 1350px;">
    
    <!-- THANH CÔNG CỤ -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mb-4 bg-dark bg-opacity-50 p-3 rounded-4 border border-secondary border-opacity-25">
      <div>
        <h4 class="fw-bold text-info mb-1">
          <i class="fas fa-satellite-dish me-2"></i>UFO GỌI TÊN HỌC SINH 2627
        </h4>
        <small class="text-secondary">Dữ liệu tự động lưu trữ vào Google Sheet: <b>UFO_GOI_TEN_2627</b></small>
      </div>

      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="small fw-bold text-secondary ps-2">Lớp:</span>
        <select id="selClass" class="form-select form-select-sm bg-dark text-info border-secondary fw-bold" style="width: 130px;" onchange="onClassChange()">
          <option value="">-- Nạp lớp... --</option>
        </select>
        
        <div class="form-check form-switch m-0 ms-2">
          <input class="form-check-input" type="checkbox" id="chkNoRepeat" checked style="cursor: pointer;">
          <label class="form-check-label small text-light" for="chkNoRepeat">Chống gọi trùng</label>
        </div>

        <button onclick="resetCalledList()" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          <i class="fas fa-redo me-1"></i> Làm mới
        </button>
      </div>
    </div>

    <!-- KHU VỰC ĐĨA BAY & LỊCH SỬ -->
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="space-stage text-center">
          
          <div class="ufo-wrapper">
            <div class="ufo-dome"></div>
            <div class="ufo-disk">
              <div class="ufo-lights">
                <span class="ufo-light"></span>
                <span class="ufo-light"></span>
                <span class="ufo-light"></span>
                <span class="ufo-light"></span>
              </div>
            </div>
          </div>

          <div class="tractor-beam" id="tractorBeam"></div>

          <div class="student-display-box">
            <div class="student-id-text" id="displayId">SẴN SÀNG QUÉT HỌC SINH</div>
            <div class="student-name-text my-1" id="displayName">🛸🛸🛸</div>
            <div id="subStatus" class="small text-secondary mt-1">Bấm nút bên dưới để phát tia hút lượng tử</div>
          </div>

          <div class="mt-4 pt-3 position-relative" style="z-index: 30;">
            <button onclick="startUfoScan()" id="btnScan" class="btn btn-info btn-lg rounded-pill px-5 py-3 fw-bold shadow-lg text-dark fs-5">
              <i class="fas fa-meteor me-2"></i> PHÁT TIA HÚT GỌI TÊN
            </button>
          </div>

        </div>
      </div>

      <!-- CỘT GHI VẾT LỊCH SỬ SHEET -->
      <div class="col-lg-4">
        <div class="panel-card d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
            <h6 class="fw-bold text-info m-0"><i class="fas fa-history me-2"></i>NHẬT KÝ ĐÃ GỌI (SHEET)</h6>
            <button onclick="loadHistoryFromSheet()" class="btn btn-sm btn-outline-info rounded-pill px-2">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>

          <div class="flex-grow-1 overflow-auto mb-3" style="max-height: 430px;" id="historyContainer">
            <div class="text-secondary small fst-italic py-3 text-center">Đang nạp dữ liệu từ Sheet...</div>
          </div>

          <div class="p-2 bg-dark bg-opacity-50 rounded-3 border border-secondary small text-secondary">
            <i class="fas fa-database text-warning me-1"></i>
            Tự động lưu lượt gọi vào sheet <b>UFO_GOI_TEN_2627</b>.
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx7CIwSPjv3PM9s7fdi1xLJOb18rkYG9upg9UgWOk8gdie_29e_uZrJZFOwQltYrLUxcw/exec";

    let studentList = [];
    let calledIds = [];
    let isScanning = false;
    let audioCtx = null;

    async function callApi(fn, ...args) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      return data.result;
    }

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playLaserHum() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300 + Math.random() * 450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    function playVictoryChime() {
      try {
        const ctx = getAudioContext();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.55);
        });
      } catch(e) {}
    }

    window.onload = async function() {
      try {
        const classes = await callApi('getAllClasses');
        const sel = document.getElementById('selClass');
        let html = '<option value="">-- Chọn lớp --</option>';
        (classes || []).forEach(c => html += `<option value="${c}">${c}</option>`);
        sel.innerHTML = html;

        if (classes && classes.length > 0) {
          sel.value = classes[0];
          await onClassChange();
        }
      } catch (err) {
        console.error("Lỗi nạp lớp:", err);
      }
    };

    async function onClassChange() {
      const className = document.getElementById('selClass').value;
      if (!className) return;

      calledIds = [];
      document.getElementById('displayId').innerText = "ĐANG TẢI LỚP " + className;
      document.getElementById('displayName').innerText = "🛸 SẴN SÀNG";

      try {
        studentList = await callApi('getStudentList', className) || [];
      } catch (e) {
        studentList = [];
      }

      loadHistoryFromSheet();
    }

    async function loadHistoryFromSheet() {
      const className = document.getElementById('selClass').value;
      const container = document.getElementById('historyContainer');
      try {
        const list = await callApi('getUfoCallHistory2627', className);
        if (!list || list.length === 0) {
          container.innerHTML = '<div class="text-secondary small fst-italic py-3 text-center">Chưa có lượt gọi nào của lớp này trong Sheet.</div>';
          return;
        }

        let html = '';
        list.forEach(r => {
          html += `
            <div class="history-item">
              <div class="d-flex justify-content-between text-secondary" style="font-size:11px;">
                <span><i class="far fa-clock me-1"></i>${r.time}</span>
                <span class="badge bg-secondary bg-opacity-25 text-info">${r.studentId}</span>
              </div>
              <div class="fw-bold text-light mt-1">${r.studentName}</div>
              <div class="small text-warning">${r.note || 'Phát biểu'}</div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<div class="text-danger small p-2">Lỗi tải lịch sử sheet: ' + e.message + '</div>';
      }
    }

    function startUfoScan() {
      if (isScanning) return;
      if (!studentList || studentList.length === 0) return alert("Lớp chưa có học sinh!");

      const noRepeat = document.getElementById('chkNoRepeat').checked;
      let availableStudents = noRepeat 
        ? studentList.filter(s => !calledIds.includes(s.id))
        : studentList;

      if (availableStudents.length === 0) {
        if (confirm("Đã gọi hết cả lớp! Đặt lại danh sách để gọi vòng mới?")) {
          calledIds = [];
          availableStudents = studentList;
        } else {
          return;
        }
      }

      isScanning = true;
      const btn = document.getElementById('btnScan');
      const beam = document.getElementById('tractorBeam');
      const nameEl = document.getElementById('displayName');
      const idEl = document.getElementById('displayId');
      const statusEl = document.getElementById('subStatus');

      btn.disabled = true;
      beam.classList.add('active');
      statusEl.innerText = "⚡ ĐANG CHIẾU TIA QUÉT HỌC SINH...";

      let duration = 3000;
      let startTime = Date.now();

      const scanTimer = setInterval(() => {
        const rand = availableStudents[Math.floor(Math.random() * availableStudents.length)];
        nameEl.innerText = rand.name;
        idEl.innerText = `${rand.id}`;
        playLaserHum();

        if (Date.now() - startTime > duration) {
          clearInterval(scanTimer);

          const winner = availableStudents[Math.floor(Math.random() * availableStudents.length)];
          nameEl.innerText = winner.name;
          idEl.innerText = `⭐ ĐÃ CHỌN: ${winner.id}`;
          statusEl.innerText = "🎯 ĐANG LƯU VÀO GOOGLE SHEET...";

          playVictoryChime();

          if (noRepeat) calledIds.push(winner.id);

          const currentClass = document.getElementById('selClass').value;
          callApi('saveUfoCallRecord2627', {
            className: currentClass,
            studentId: winner.id,
            studentName: winner.name,
            note: "Trả lời câu hỏi"
          }).then(() => {
            statusEl.innerText = "✅ ĐÃ LƯU VÀO SHEET UFO_GOI_TEN_2627!";
            loadHistoryFromSheet();
          }).catch(err => {
            statusEl.innerText = "❌ Lỗi lưu sheet: " + err.message;
          });

          beam.classList.remove('active');
          btn.disabled = false;
          isScanning = false;
        }
      }, 60);
    }

    function resetCalledList() {
      calledIds = [];
      document.getElementById('subStatus').innerText = "Đã làm mới danh sách gọi.";
    }
  </script>
</body>
</html>
