      padding: 6px 18px;
      border-radius: 50px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .grid-table-scroll {
      max-height: 75vh;
      overflow-y: auto;
      overflow-x: auto !important;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      background: white;
      scroll-behavior: smooth;
      position: relative;
      display: block;
      width: 100%;
    }

    #violation-grid-table, #weekly-emulation-table, #class-violation-table, #global-attendance-table {
      min-width: max-content !important;
      border-collapse: separate !important;
      border-spacing: 0;
    }

    .sticky-header th {
      position: sticky;
      top: 0;
      background: #f8fafc !important;
      z-index: 20;
      border-bottom: 2px solid #cbd5e0;
      white-space: nowrap;
    }

    .sticky-col-fixed {
      position: sticky !important;
      left: 0 !important;
      background-color: #ffffff !important;
      z-index: 100 !important;
      border-right: 3px solid #0d6efd !important;
      min-width: 150px;
      box-shadow: 4px 0 8px rgba(0,0,0,0.05);
    }

    .content-tab { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: #dee2e6;
      gap: 1px;
      border-bottom: 1px solid #dee2e6;
    }
    .cal-header {
      background-color: #f8f9fa;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      color: #495057;
    }
    .cal-day {
      background-color: #fff;
      min-height: 120px;
      padding: 8px;
      position: relative;
    }
    .cal-day:hover { background-color: #f0f7ff; }
    .cal-day.today { background-color: #fff3cd !important; }
    .cal-num { font-weight: bold; font-size: 14px; color: #adb5bd; margin-bottom: 5px; display: block; }
    .cal-note { width: 100%; border: none; background: transparent; font-size: 12px; resize: none; height: 80px; outline: none; }

    #V_SM_grid_container {
      display: grid !important;
      grid-template-columns: repeat(6, 145px) !important;
      gap: 20px 15px;
      justify-content: center;
      padding: 30px;
      background: #ffffff;
    }
    .v-sm-card {
      width: 145px; background: white; border-radius: 15px; padding: 12px;
      display: flex; flex-direction: column; align-items: center;
      border: 2px solid #eee; transition: 0.3s ease;
    }
    .v-sm-card:hover { border-color: #0d6efd; transform: translateY(-3px); }
    .v-sm-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; }
    .v-sm-name { font-size: 11px; font-weight: 700; text-align: center; height: 32px; overflow: hidden; line-height: 1.2; color: #333; }
    .v-sm-input { width: 35px; height: 24px; font-size: 11px; padding: 0; text-align: center; border-radius: 4px; border: 1px solid #ddd; }

    .birthday-badge-full {

      font-size: 11px !important;
      line-height: 1.4;
      margin-bottom: 5px;

        top: 0; bottom: 0;

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyMVIHvDEpHWGhueVXIsB79aoDfCn-LELYSWCRrbRjtqkZj-uD5mcn30CrYWaRNrmnMsg/exec";

    window.google = window.google || {};
    window.google.script = window.google.script || {};

    function createRunner(successHandler, failureHandler) {
      return new Proxy({}, {
        get: function(target, prop) {
          if (prop === 'withSuccessHandler') return function(cb) { return createRunner(cb, failureHandler); };
          if (prop === 'withFailureHandler') return function(cb) { return createRunner(successHandler, cb); };
          return async function(...args) {
            try {
              const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ fn: prop, args: args })
              });
              const json = await res.json();
              if (json.error) {
                if (typeof failureHandler === 'function') failureHandler(new Error(json.error));
                else alert('Lỗi máy chủ: ' + json.error);
                return;
              }
              if (typeof successHandler === 'function') successHandler(json.result);
            } catch (err) {
              if (typeof failureHandler === 'function') failureHandler(err);
              else console.error('Lỗi API (' + prop + '):', err);
            }
          };
        }
      });
    }

    window.google.script.run = createRunner();

    var currentUser = {};

    window.onload = function() {
      var saved = localStorage.getItem('eduUser');
      if (saved) {
        try { loginSuccess(JSON.parse(saved)); } catch (e) { localStorage.removeItem('eduUser'); }
      }
    };

    function processLogin() {
      var btn = document.getElementById('btnLogin');
      var email = document.getElementById('email').value;
      var pass = document.getElementById('pass').value;
      if (!email || !pass) return alert("Vui lòng nhập đủ thông tin!");
      btn.innerText = "Đang kiểm tra..."; btn.disabled = true;

      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            localStorage.setItem('eduUser', JSON.stringify(res));
            loginSuccess(res);
          } else {
            alert(res ? res.message : "Đăng nhập thất bại");
            btn.innerText = "XÁC NHẬN ĐĂNG NHẬP"; btn.disabled = false;
          }
        })
        .withFailureHandler(function(err) {
          alert("Lỗi kết nối: " + err.message);
          btn.innerText = "XÁC NHẬN ĐĂNG NHẬP"; btn.disabled = false;
        })
        .loginUser(email, pass);
    }

    function loginSuccess(res) {
      try {
        google.script.run.logUserActivity2627({
          email: res.email || 'admin@edu.vn',
          name: res.name || 'Người dùng',
          role: res.role || 'ADMIN',
          action: 'Đăng nhập hệ thống thành công',
          device: navigator.userAgent.substring(0, 50)
        });
      } catch(e) { console.log(e); }

      currentUser = res;
      document.getElementById('u-name').innerText = res.name;
      document.getElementById('u-role').innerText = res.role;
      var avt = 'https://ui-avatars.com/api/?background=0D6EFD&color=fff&bold=true&name=' + encodeURIComponent(res.name);
      document.getElementById('u-avatar').src = res.avatar || avt;

      var defaultMenuHtml = document.getElementById('sidebar-menu').innerHTML;
      var dynamicMenuHtml = '';
      var dataMenu = res.menu || res.menus || [];
          
      if (res.role === 'HS') {
        var hasBell = dataMenu.some(function(m) { return m.id === 'school_bell_2627'; });
        if (!hasBell) {
          dataMenu.push({
            id: 'school_bell_2627',
            text: 'Chuông & Trống Trường',
            icon: 'fa-bell'
          });
        }
      }

      dataMenu.forEach(function(m) {
        dynamicMenuHtml += `<div onclick="switchTab('${m.id}', this)" class="list-group-item rounded mb-2" style="cursor: pointer;">
                             <i class="fas ${m.icon} me-3" style="width:20px"></i> <span>${m.text}</span>
                           </div>`;
      });

      // Kết hợp menu tĩnh (4 menu cố định phía trên) và menu động của tài khoản
      document.getElementById('sidebar-menu').innerHTML = defaultMenuHtml + dynamicMenuHtml;
      document.getElementById('login-view').classList.add('d-none');
      document.getElementById('main-view').classList.remove('d-none');

      loadAllClasses();
      if (['HS', 'PH'].includes(res.role)) switchTab('my_profile', document.querySelector('#sidebar-menu div'));
      else loadDashboard();
    }

    function handleLogout() {
      if (confirm("Thầy/Cô muốn thoát hệ thống?")) {
        localStorage.removeItem('eduUser');
        document.getElementById('main-view').classList.add('d-none');
        document.getElementById('login-view').classList.remove('d-none');
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar-wrapper').classList.toggle('active');
    }

    function switchTab(id, el) {
      if (window.innerWidth <= 768) {
        var sidebar = document.getElementById('sidebar-wrapper');
        if (sidebar) sidebar.classList.remove('active');
      }

      var tabs = document.querySelectorAll('.content-tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.add('d-none');

      var target = document.getElementById('tab-' + id);
      var menuText = el ? (el.innerText || el.textContent || '').toLowerCase().replace(/\s+/g, ' ') : '';
      var idLower = String(id || '').toLowerCase();

      if (!target) {
        if (idLower.includes('tuition') || menuText.includes('học phí')) {
          target = document.getElementById('tab-homeroom_tuition_manager');
        } else if (idLower.includes('ai_exam') || menuText.includes('soạn đề') || menuText.includes('ai')) {
          target = document.getElementById('tab-ai_exam_generator');
        } else if (idLower.includes('essay') || menuText.includes('tự luận')) {
          target = document.getElementById('tab-essay_grading_paper');
        } else if (idLower.includes('activity') || menuText.includes('nhật ký hoạt động')) {
          target = document.getElementById('tab-activity_log_admin');
        } else if (idLower.includes('ck1') || menuText.includes('ôn ck1') || menuText.includes('tin học 6')) {
          target = document.getElementById('tab-on_ck1_tin6');
        } else if (idLower.includes('vnedu') || menuText.includes('vnedu')) {
          target = document.getElementById('tab-detailed_scores');
        }
      }

      if (target) target.classList.remove('d-none');

      var items = document.querySelectorAll('#sidebar-menu .list-group-item');
      for (var j = 0; j < items.length; j++) items[j].classList.remove('active');
      if (el) {
        el.classList.add('active');
        document.getElementById('page-title').innerText = el.innerText.trim();
      }
    }
  </script>
